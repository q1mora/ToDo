<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Launch Lab</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf2fa;font:18px/1.6 system-ui,sans-serif}main{max-width:820px;margin:70px auto;padding:28px}.tag{color:#7dd3fc}h1{font-size:clamp(40px,8vw,76px);line-height:1.1}button{background:#7dd3fc;color:#101827;border:0;border-radius:8px;padding:14px 22px;font:inherit;cursor:pointer}.card{border:1px solid #46516a;padding:24px;border-radius:14px;margin:28px 0}footer{color:#b7c3d8}button:focus-visible{outline:3px solid white;outline-offset:4px}</style></head>
<body><main><p class="tag">VERCEL LAUNCH LAB</p><h1>From code to the world.</h1><p>This is our first production release.</p><section class="card"><h2>A tiny interactive website</h2><p>Press the button to test the page.</p><button id="launch">Launch the celebration</button><p id="status" aria-live="polite">Ready for launch.</p></section><footer>Built by our class. Version 1.</footer></main><script>let clicks=0;document.querySelector('#launch').addEventListener('click',()=>{clicks++;document.querySelector('#status').textContent=`Launch successful! Button pressed ${clicks} time${clicks===1?'':'s'}.`;});</script></body></html>
